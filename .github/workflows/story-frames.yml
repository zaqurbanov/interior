# Frame extraction for walkthroughs edited in the admin panel. Dispatched by
# src/lib/frame-jobs.ts; runs scripts/process-story.mjs and reports back to the
# site. Repository secrets: BLOB_READ_WRITE_TOKEN, STORY_WEBHOOK_SECRET.
name: Story frames

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job JSON from the admin panel"
        required: true
      callback:
        description: "Site URL that receives the result"
        required: true

concurrency:
  group: story-frames-${{ github.run_id }}

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the scripts are needed, not the committed frames.
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install @vercel/blob
        # Drop the project manifest so npm installs this one package, not the whole site.
        run: rm -f package.json package-lock.json && npm install --no-save --no-package-lock @vercel/blob@2
      - name: Extract frames
        env:
          STORY_JOB: ${{ inputs.job }}
          STORY_CALLBACK: ${{ inputs.callback }}
          STORY_WEBHOOK_SECRET: ${{ secrets.STORY_WEBHOOK_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/process-story.mjs
